syntax = "proto3";

package raftkv;

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message GetRequest {
  string key = 1;
}

message DeleteRequest {
  string key = 1;
}

message KVResponse {
  bool success = 1;
  bytes value = 2;
  bool is_leader = 3;
  string leader_hint = 4;
}

service KVStoreService {
  rpc Put(PutRequest) returns (KVResponse);
  rpc Get(GetRequest) returns (KVResponse);
  rpc Delete(DeleteRequest) returns (KVResponse);
}
